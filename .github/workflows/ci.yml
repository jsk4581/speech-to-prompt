name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: helper/package-lock.json
      - name: Install
        working-directory: helper
        run: npm ci --no-fund --no-audit
      - name: Build
        working-directory: helper
        run: npm run build
      - name: Unit tests
        # Explicit file list: node 22 no longer scans a bare directory argument,
        # and Windows runners don't glob for native commands.
        run: node --test tests/xml.test.mjs tests/grill.test.mjs
